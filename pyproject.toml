[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Enterprise RAG Platform with FastAPI, ChromaDB, PostgreSQL, LangChain/LlamaIndex, S3 storage, and RBAC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "chromadb",
  "qdrant-client",
  "redis",
  "httpx",
  "structlog",
  "python-multipart",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "boto3",
]

[project.optional-dependencies]
ingestion = [
  "pypdf",
  "pdfplumber",
  "python-docx",
  "openpyxl",
  "python-pptx",
  "unstructured",
]
rag = [
  "langchain",
  "langchain-community",
  "langchain-core",
  "sentence-transformers",
  "rank-bm25",
  "numpy",
]
eval = [
  "datasets",
  "beir",
  "ranx",
  "pandas",
]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
