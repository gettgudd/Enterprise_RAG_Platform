repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbid-data-commits
        name: Forbid raw data commits
        entry: 'Raw dataset files must not be committed to Git. Check .gitignore.'
        language: fail
        files: '^data/(enterprise_demo|sec_edgar|evaluation|enron|processed|eval_internal)/.+\.(pdf|docx|xlsx|pptx|txt|jsonl|parquet|tar\.gz|zip)$'
